name: Flujo de trabajo para ejecutar los test
on:
  workflow_dispatch:
  push:
    branches: [ V.0.2 ]
  pull_request:
    branches: [ V.0.2 ]

jobs:
  # TRABAJO 1: Construcción del artefacto
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonando el repositorio
        uses: actions/checkout@v3
      - name: Configurando java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'
      - name: Construyendo el JAR
        run: |
          chmod +x gradlew
          ./gradlew jar

  # TRABAJO 2: Verificación (Solo si Build tiene éxito)
  Test:
    runs-on: ubuntu-latest
    needs: Build  
    steps:
      - name: Clonando el repositorio
        uses: actions/checkout@v3
      - name: Configurando java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'
      - name: Ejecutando pruebas unitarias
        run: |
          chmod +x gradlew
          ./gradlew test
